[package]
name = "playlist-mixer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"

[[bin]]
name = "playmx"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
