[package]
name = "playlist-mixer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
ratatui = "0.29"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"

[[bin]]
name = "playmx"
path = "src/main.rs"
